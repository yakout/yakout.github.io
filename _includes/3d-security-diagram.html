<div id="canvas-container" style="width: 100%; height: 500px; background: #000; border-radius: 8px; margin: 20px 0; overflow: hidden; position: relative; border: 1px solid #222;">
  <div style="position: absolute; top: 20px; left: 20px; color: #00ffcc; font-family: 'Courier New', monospace; font-size: 14px; z-index: 10; text-shadow: 0 0 10px #00ffcc;">
    INFILTRATION ANALYSIS: DATA -> BRAIN
  </div>
  <canvas id="three-canvas" style="display: block;"></canvas>
</div>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

  const container = document.getElementById('canvas-container');
  const canvas = document.getElementById('three-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 0, 15);

  // --- 1. THE "BRAIN" (A core of neurons) ---
  const nodeGroup = new THREE.Group();
  const nodeCount = 40;
  const nodes = [];
  const nodeGeo = new THREE.SphereGeometry(0.1, 8, 8);
  const nodeMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

  for (let i = 0; i < nodeCount; i++) {
    const node = new THREE.Mesh(nodeGeo, nodeMat.clone());
    const phi = Math.acos(-1 + (2 * i) / nodeCount);
    const theta = Math.sqrt(nodeCount * Math.PI) * phi;
    node.position.setFromSphericalCoords(3, phi, theta);
    nodeGroup.add(node);
    nodes.push(node);
  }
  
  // Connections between nodes
  const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.2 });
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      if (nodes[i].position.distanceTo(nodes[j].position) < 2.5) {
        const geo = new THREE.BufferGeometry().setFromPoints([nodes[i].position, nodes[j].position]);
        const line = new THREE.Line(geo, lineMat);
        nodeGroup.add(line);
      }
    }
  }
  nodeGroup.position.x = 4;
  scene.add(nodeGroup);

  // --- 2. THE DATA STREAM ---
  const particles = [];
  const pGeo = new THREE.BoxGeometry(0.3, 0.1, 0.05);
  
  for (let i = 0; i < 40; i++) {
    const isPoison = i % 8 === 0;
    const pMat = new THREE.MeshBasicMaterial({ color: isPoison ? 0xff0055 : 0x00ffcc });
    const p = new THREE.Mesh(pGeo, pMat);
    p.position.set(-10 - Math.random() * 10, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 4);
    p.userData.isPoison = isPoison;
    p.userData.speed = 0.1 + Math.random() * 0.1;
    scene.add(p);
    particles.push(p);
  }

  // --- 3. ANIMATION ---
  function animate() {
    requestAnimationFrame(animate);

    nodeGroup.rotation.y += 0.005;
    nodeGroup.rotation.z += 0.002;

    particles.forEach(p => {
      p.position.x += p.userData.speed;
      
      // When data hits the brain area
      if (p.position.x > 3 && p.position.x < 5 && Math.abs(p.position.y) < 3) {
        if (p.userData.isPoison) {
          // Trigger visual "glitch"
          nodes.forEach(n => {
            if (Math.random() > 0.95) n.material.color.setHex(0xff0055);
            else if (Math.random() > 0.98) n.material.color.setHex(0x00ffcc);
          });
        }
      }

      if (p.position.x > 10) {
        p.position.x = -10;
        p.position.y = (Math.random() - 0.5) * 6;
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  animate();
</script>
