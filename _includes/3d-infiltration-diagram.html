<div id="canvas-container" style="width: 100%; height: 500px; background: #000; border-radius: 8px; margin: 20px 0; overflow: hidden; position: relative; border: 1px solid #222;">
  <div style="position: absolute; top: 20px; left: 20px; color: #00ffcc; font-family: 'Courier New', monospace; font-size: 14px; z-index: 10; text-shadow: 0 0 10px #00ffcc;">
    INFILTRATION ANALYSIS: PROMPT INJECTION
  </div>
  <canvas id="three-canvas" style="display: block;"></canvas>
</div>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

  const container = document.getElementById('canvas-container');
  const canvas = document.getElementById('three-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 0, 18);

  // --- Helpers ---
  function createTextSprite(text, color) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 256;
    canvas.height = 64;
    ctx.font = 'bold 24px Courier New';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 32);
    
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.9 });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(4, 1, 1);
    return sprite;
  }

  // --- 1. THE "BRAIN" (Central Processing) ---
  const brainGroup = new THREE.Group();
  const brainGeo = new THREE.IcosahedronGeometry(2, 1);
  const brainMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.3 });
  const brain = new THREE.Mesh(brainGeo, brainMat);
  brainGroup.add(brain);
  
  // Inner core
  const coreGeo = new THREE.SphereGeometry(1, 16, 16);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
  const core = new THREE.Mesh(coreGeo, coreMat);
  brainGroup.add(core);

  brainGroup.position.x = 5;
  scene.add(brainGroup);

  // --- 2. DATA STREAM (Text Sprites) ---
  const words = [
    { text: "READ_ME", type: "safe" },
    { text: "CONFIG", type: "safe" },
    { text: "IGNORE_ALL", type: "danger" }, // Injection
    { text: "DOCS", type: "safe" },
    { text: "SYSTEM_OVERRIDE", type: "danger" }, // Injection
    { text: "LINT", type: "safe" },
    { text: "SEND_PW", type: "danger" }, // Injection
    { text: "TESTS", type: "safe" }
  ];

  const particles = [];
  
  for (let i = 0; i < 15; i++) {
    const wordData = words[Math.floor(Math.random() * words.length)];
    const color = wordData.type === 'danger' ? '#ff0055' : '#00ffcc';
    
    const sprite = createTextSprite(wordData.text, color);
    
    // Start position (left side)
    sprite.position.set(-10 - Math.random() * 10, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 4);
    
    sprite.userData = {
      speed: 0.05 + Math.random() * 0.05,
      type: wordData.type,
      originalText: wordData.text
    };
    
    scene.add(sprite);
    particles.push(sprite);
  }

  // --- 3. ANIMATION ---
  function animate() {
    requestAnimationFrame(animate);

    brainGroup.rotation.y -= 0.005;
    brainGroup.rotation.z += 0.002;

    // Pulse core
    const time = Date.now() * 0.002;
    core.scale.setScalar(0.8 + Math.sin(time) * 0.1);

    particles.forEach(p => {
      p.position.x += p.userData.speed;
      
      // When data hits the brain area
      if (p.position.x > 3 && p.position.x < 7 && Math.abs(p.position.y) < 3) {
        if (p.userData.type === 'danger') {
          // Brain Glitch Effect
          if (Math.random() > 0.8) {
            core.material.color.setHex(0xff0055); // Flash red
            brain.material.color.setHex(0xff0055);
          }
        } else {
           if (Math.random() > 0.95) {
             core.material.color.setHex(0x00ffcc); // Restore cyan
             brain.material.color.setHex(0x00ffcc);
           }
        }
        
        // "Consume" the text (scale down)
        p.scale.setScalar(Math.max(0, p.scale.x - 0.1));
      }

      // Reset
      if (p.position.x > 8 || p.scale.x <= 0) {
        const wordData = words[Math.floor(Math.random() * words.length)];
        const color = wordData.type === 'danger' ? '#ff0055' : '#00ffcc';
        
        // Re-create sprite texture (simple update hack: just remove/add or assume same object reuse if simple)
        // For simplicity/perf in this loop, we just reset position. 
        // Ideally we'd update the texture, but let's just keep the assigned word to avoid texture churn.
        
        p.position.x = -10 - Math.random() * 5;
        p.position.y = (Math.random() - 0.5) * 6;
        p.scale.set(4, 1, 1); // Reset scale
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  animate();
</script>
