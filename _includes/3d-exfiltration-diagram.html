<div id="exfil-container" style="width: 100%; height: 500px; background: #000; border-radius: 8px; margin: 20px 0; overflow: hidden; position: relative; border: 1px solid #222;">
  <div style="position: absolute; top: 20px; left: 20px; color: #ff9900; font-family: 'Courier New', monospace; font-size: 14px; z-index: 10; text-shadow: 0 0 10px #ff9900;">
    EXFILTRATION ANALYSIS: DATA LEAK
  </div>
  <canvas id="exfil-canvas" style="display: block;"></canvas>
</div>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

  const container = document.getElementById('exfil-container');
  const canvas = document.getElementById('exfil-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 2, 18); // Lowered camera angle
  camera.lookAt(0, 2, 0);

  // --- Helpers ---
  function createTextSprite(text, color) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 256;
    canvas.height = 64;
    ctx.font = 'bold 24px Courier New';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 32);
    
    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 1.0 });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(4, 1, 1);
    return sprite;
  }

  // --- 1. THE LOCAL DATA GRID (Base) ---
  const gridHelper = new THREE.GridHelper(15, 15, 0x004433, 0x050505);
  gridHelper.position.y = -3;
  scene.add(gridHelper);

  // --- 2. THE ATTACKER SERVER (Destination) ---
  const attackerGroup = new THREE.Group();
  
  // Wireframe Box (The Server)
  const boxGeo = new THREE.BoxGeometry(3, 2, 3);
  const boxMat = new THREE.MeshBasicMaterial({ color: 0xff3300, wireframe: true });
  const serverBox = new THREE.Mesh(boxGeo, boxMat);
  attackerGroup.add(serverBox);
  
  // "ATTACKER" Label
  const label = createTextSprite("ATTACKER_SERVER", "#ff3300");
  label.position.y = 1.5;
  attackerGroup.add(label);

  attackerGroup.position.y = 4; // Lowered from 6 to avoid overlap, but distinct
  scene.add(attackerGroup);

  // --- 3. DATA NODES (Text) ---
  const sensitiveData = [
    "API_KEY", "AWS_SECRET", "CHAT_LOG", "PASSWORD", "ID_RSA", 
    "DB_HOST", "TOKEN", "EMAIL_DUMP", "SSH_KEY"
  ];

  const particles = [];
  
  for(let i = 0; i < 15; i++) {
    const text = sensitiveData[Math.floor(Math.random() * sensitiveData.length)];
    // Start as "Safe" cyan
    const sprite = createTextSprite(text, '#ffffff'); // Placeholder color, we set in animate
    
    // Random position on floor
    sprite.position.set(Math.random() * 12 - 6, -2.5, Math.random() * 6 - 3);
    
    sprite.userData = {
      originalPos: sprite.position.clone(),
      text: text,
      isStolen: false,
      speed: 0.04 + Math.random() * 0.04
    };
    
    scene.add(sprite);
    particles.push(sprite);
  }

  function animate() {
    requestAnimationFrame(animate);

    // Rotate Attacker Server slightly
    serverBox.rotation.y += 0.01;
    
    particles.forEach(p => {
      if (!p.userData.isStolen) {
        // Safe state: move slightly
        p.position.y = -2.5 + Math.sin(Date.now() * 0.002 + p.userData.originalPos.x) * 0.1;
        p.material.color.setHex(0x00aaff); // Bright Blue (Safe)
        
        // Randomly get "stolen"
        if (Math.random() > 0.99) p.userData.isStolen = true;
      } else {
        // Stolen state: move up to attacker
        p.position.y += p.userData.speed;
        
        // Move towards center (x=0, z=0)
        p.position.x = THREE.MathUtils.lerp(p.position.x, 0, 0.02);
        p.position.z = THREE.MathUtils.lerp(p.position.z, 0, 0.02);
        
        // Change color to Bright Orange/Red
        p.material.color.setHex(0xffaa00); 
        
        // Reset if reached server
        if (p.position.y > 4) {
          p.position.copy(p.userData.originalPos);
          p.userData.isStolen = false;
        }
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  animate();
</script>
